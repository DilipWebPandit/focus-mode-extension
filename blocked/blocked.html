<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stay focused</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <h1 id="title">Stay focused</h1>
      <p id="message" class="message"></p>
      <div id="timerBlock" class="timer-block">
        <span class="label">Time left</span>
        <span id="timer" class="timer"></span>
      </div>
      <div class="actions">
        <button id="back" type="button" class="primary">Go back</button>
        <a id="continue" class="secondary" href="#" hidden>Continue to site</a>
      </div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
